services:
  db:
    image: postgres:16-alpine
    container_name: web-ban-hang-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webbanhang
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-ban-hang-app
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/webbanhang?schema=public
      JWT_SECRET: change_me_to_a_strong_secret
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    command: sh -c "node_modules/.bin/prisma db push && node server.js"

volumes:
  postgres_data:
